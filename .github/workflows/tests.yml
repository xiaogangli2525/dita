name: Editor regression tests
on:
  workflow_dispatch:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright-core install --with-deps chromium
      - run: sudo apt-get install -y poppler-utils
      - run: npm run prepare:semantic
      - run: npm run test:browser
        env:
          BLINK_MODELS: ./models
  semantic-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify document saving and Git commit on Windows
        run: node --test tests/document-batch.test.js tests/git-commit.test.js
      - run: npm run prepare:semantic
      - run: node --test tests/knowledge-semantic.test.js tests/knowledge-structure.test.js tests/knowledge-cli.test.js tests/knowledge-cache.test.js tests/knowledge-publish.test.js
        env:
          BLINK_MODELS: ./models
      - run: node scripts/check-semantic.js dist/smoke.json
      - run: npm run build:blink -- dist/smoke.json dist/blink-cli-windows-x64.zip dist/smoke.zip
      - shell: pwsh
        run: |
          $noticePath = 'onnxruntime-third-party-1.21.0.txt'
          $noticeHash = (Get-FileHash -Algorithm SHA256 (Join-Path 'docs/licenses' $noticePath)).Hash
          Expand-Archive dist/blink-cli-windows-x64.zip -DestinationPath dist/unpacked
          Set-Location dist/unpacked/blink-cli
          if (Test-Path node_modules) { throw 'Runtime dependencies leaked into the public root' }
          if (!(Test-Path docs/index.html)) { throw 'HTML reader missing from the portable package' }
          if (!(Test-Path blink-reader.cmd)) { throw 'Local reader launcher missing from the portable package' }
          if (!(Test-Path runtime/app/node_modules)) { throw 'Bundled runtime dependencies missing' }
          if ((Get-FileHash -Algorithm SHA256 runtime/LICENSE).Hash -ne '8cc9bb466b19fc7e7cc99d03e9df1132021fda8b01eea2624c58bb372dbef576') { throw 'Bundled Node.js license differs from the official Windows archive' }
          if ((Get-FileHash -Algorithm SHA256 (Join-Path 'runtime/licenses' $noticePath)).Hash -ne $noticeHash) { throw 'Bundled ONNX Runtime third-party notices differ from source' }
          $json = & .\blink-cli.cmd '日志抓取方法' --search semantic --json
          if ($LASTEXITCODE -ne 0) { throw 'Portable CLI failed' }
          $result = $json | ConvertFrom-Json
          if ($result.results[0].title -ne '日志抓取方法') { throw 'Portable search returned an unexpected chapter' }
          & .\blink-cli.cmd --kb .\docs\index.html --build-index .\verified-structure.json
          if ($LASTEXITCODE -ne 0) { throw 'Portable structural index generation failed' }
          $verified = Get-Content .\verified-structure.json -Raw | ConvertFrom-Json
          if ($verified.semantic.profile.id -ne 'bge-small-zh-int8-cls-v3') { throw 'Unexpected chunking profile' }
          if (!($verified.semantic.chunks | Where-Object { $_.kind -eq 'paragraph' })) { throw 'Published HTML structure was not recovered' }

          $env:BLINK_MODELS = Join-Path $PWD 'missing-model'
          $json = & .\blink-cli.cmd --kb .\docs\index.html --build-index .\verified-cached.json --json
          if ($LASTEXITCODE -ne 0) { throw 'Portable manual cache reuse failed' }
          $cached = $json | ConvertFrom-Json
          if ($cached.reusedManuals -ne 1 -or $cached.rebuiltManuals -ne 0) { throw 'Portable cache statistics are incorrect' }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the Python portable KB without Node
        shell: pwsh
        run: |
          python python/build_kb_bundle.py dist/unpacked/blink-cli/docs models dist/blink-kb-python.zip
          if ($LASTEXITCODE -ne 0) { throw 'Python KB bundle build failed' }
          Expand-Archive dist/blink-kb-python.zip -DestinationPath 'dist/Python offline KB'
          $env:BLINK_PYTHON = (Get-Command python).Source
          $env:BLINK_KB = (Resolve-Path 'dist/Python offline KB/blink-kb/docs').Path
          $env:BLINK_MODELS = (Resolve-Path 'dist/Python offline KB/blink-kb/models').Path
          $env:BLINK_TEST_KB = $env:BLINK_KB
          $env:PYTHONPATH = (Resolve-Path 'dist/Python offline KB/blink-kb/_vendor').Path
          $env:PYTHONUTF8 = '1'
          $json = & 'dist/Python offline KB/blink-kb/blink-kb.cmd' '日志抓取方法' --search semantic --json
          if ($LASTEXITCODE -ne 0) { throw 'Python portable search failed' }
          $result = $json | ConvertFrom-Json
          if ($result.results[0].title -ne '日志抓取方法') { throw 'Python portable search returned an unexpected chapter' }
          python -m unittest discover -s python -p test_blink_kb.py
          if ($LASTEXITCODE -ne 0) { throw 'Python KB regression failed' }
      - name: Build reusable Windows setup kit
        run: python python/build_windows_runtime.py models dist/reader-setup
      - run: node scripts/check-semantic.js dist/uart.json --uart
      - name: Test first install, repeated setup and repair through the shipped launchers
        run: python python/check_windows_setup.py dist/reader-setup dist/unpacked/blink-cli/docs dist/uart-docs
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master'
        with:
          name: Blink-KB-Windows-x64-Setup
          path: dist/reader-setup/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master'
        with:
          name: Blink-KB-Windows-x64-Client-Update
          path: dist/reader-setup/blink-kb/
          if-no-files-found: error
          retention-days: 90
